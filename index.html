<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>少儿英语跟读</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui}
    body{padding:20px;max-width:800px;margin:0 auto;background:#f7f9fc}
    .card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 10px #00000015;margin:16px 0}
    .tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;color:#fff;margin:4px}
    .tag-薄弱{background:#ef4444}
    .tag-待巩固{background:#f59e0b}
    .tag-已熟练{background:#22c55e}
    h2{color:#333;margin:0 0 8px}
    .phonetic{color:#666;font-style:italic}
    .btn{padding:10px 16px;border:none;border-radius:8px;background:#3b82f6;color:white;font-size:16px;cursor:pointer;margin:5px}
    .tab{margin-bottom:10px}
    .tab button{background:#e2e8f0;border:none;padding:8px 14px;margin-right:6px;border-radius:8px;cursor:pointer}
    .tab button.active{background:#3b82f6;color:white}
    .filter-line{margin:12px 0}
  </style>
</head>
<body>
  <h1>英语单词 & 句子跟读</h1>
  <div class="tab">
    <button class="active" onclick="switchTab('word')">单词</button>
    <button onclick="switchTab('sentence')">句子</button>
  </div>
  <div class="filter-line">
    <button onclick="setFilter('all')">全部</button>
    <button onclick="setFilter('review')" class="active">薄弱+待巩固（复习）</button>
    <button onclick="setFilter('weak')">只看薄弱</button>
  </div>
  <div id="container"></div>

  <script>
    const API_URL = "/.netlify/functions/getSentences";
    let wordList = [];
    let sentenceList = [];
    let currentTab = "word";
    let filterMode = "review";

    // 加载后端数据
    async function loadData(){
      const res = await fetch(API_URL);
      const json = await res.json();
      // 解析单词markdown表格
      wordList = parseMarkdownTable(json.wordLib.result.structuredContent.content);
      // 解析句子markdown表格
      sentenceList = parseMarkdownTable(json.sentenceLib.result.structuredContent.content);
      render();
    }

    // 简易Markdown表格解析器
    function parseMarkdownTable(md){
      const lines = md.trim().split("\n");
      const rows = [];
      let headers = [];
      for(let line of lines){
        line = line.trim();
        if(!line || line.startsWith("|----")) continue;
        const cells = line.split("|").map(c=>c.trim()).filter(c=>c!=='');
        if(headers.length === 0){
          headers = cells;
        }else{
          const obj = {};
          for(let i=0;i<headers.length;i++){
            obj[headers[i]] = cells[i] ?? "";
          }
          rows.push(obj);
        }
      }
      return rows;
    }

    function switchTab(tab){
      currentTab = tab;
      document.querySelectorAll(".tab button").forEach(b=>b.classList.remove("active"))
      event.target.classList.add("active")
      render();
    }

    function setFilter(mode){
      filterMode = mode;
      document.querySelectorAll(".filter-line button").forEach(b=>b.classList.remove("active"))
      event.target.classList.add("active")
      render();
    }

    function render(){
      const cont = document.getElementById("container");
      cont.innerHTML = "";
      let list = currentTab === "word" ? wordList : sentenceList;

      // 筛选逻辑
      if(currentTab === "word"){
        if(filterMode === "review") list = list.filter(x=>x["单词熟练度标签"] === "薄弱" || x["单词熟练度标签"] === "待巩固");
        if(filterMode === "weak") list = list.filter(x=>x["单词熟练度标签"] === "薄弱");
      }else{
        if(filterMode === "review") list = list.filter(x=>x["句子熟练度标签"] === "薄弱" || x["句子熟练度标签"] === "待巩固");
        if(filterMode === "weak") list = list.filter(x=>x["句子熟练度标签"] === "薄弱");
      }

      for(let item of list){
        const div = document.createElement("div");
        div.className = "card";
        if(currentTab === "word"){
          div.innerHTML = `
            <h2>${item["单词"]}</h2>
            <div class="phonetic">音标：${item["音标"]||"—"}</div>
            <div>词性：${item["词性"]||"—"}</div>
            <span class="tag tag-${item["单词熟练度标签"]}">${item["单词熟练度标签"]}</span>
            <br>
            <button class="btn" onclick="readText('${item["单词"]}')">🔊 朗读</button>
          `
        }else{
          div.innerHTML = `
            <h2>${item["句子原句"]}</h2>
            <div>分类：${item["句子分类"]}</div>
            <div>可替换词：${item["可替换词"]}</div>
            <span class="tag tag-${item["句子熟练度标签"]}">${item["句子熟练度标签"]}</span>
            <br>
            <button class="btn" onclick="readText('${item["句子原句"]}')">🔊 朗读句子</button>
          `
        }
        cont.appendChild(div);
      }
    }

    //浏览器自带语音朗读
    function readText(text){
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.speak(utter);
    }

    loadData();
  </script>
</body>
</html>
