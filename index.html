<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>少儿英语跟读卡片</title>
  <style>
    *{box-sizing:border-box;font-family:system-ui}
    body{padding:20px;max-width:800px;margin:0 auto;background:#f7f9fc}
    .card{background:white;padding:24px;border-radius:16px;box-shadow:0 2px 10px #00000015;margin:16px 0}
    .tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;color:#fff;margin:4px}
    .tag-薄弱{background:#ef4444}
    .tag-待巩固{background:#f59e0b}
    .tag-已熟练{background:#22c55e}
    h2{color:#333;margin:0 0 8px}
    .phonetic{color:#666;font-style:italic}
    .btn{padding:10px 16px;border:none;border-radius:8px;background:#3b82f6;color:white;font-size:16px;cursor:pointer;margin:5px}
    .btn-record{background:#db2777;}
    .tab{margin-bottom:10px}
    .tab button{background:#e2e8f0;border:none;padding:8px 14px;margin-right:6px;border-radius:8px;cursor:pointer}
    .tab button.active{background:#3b82f6;color:white}
    .filter-line{margin:12px 0}
    .filter-line button{background:#e2e8f0;border:none;padding:8px 14px;margin-right:6px;border-radius:8px;cursor:pointer}
    .filter-line button.active{background:#3b82f6;color:white}
  </style>
</head>
<body>
  <h1>英语单词 & 句子跟读</h1>
  <div class="tab">
    <button class="active" onclick="switchTab('word')">单词</button>
    <button onclick="switchTab('sentence')">句子</button>
  </div>
  <div class="filter-line">
    <button onclick="setFilter('all')">全部</button>
    <button class="active" onclick="setFilter('review')">薄弱+待巩固（复习）</button>
    <button onclick="setFilter('weak')">只看薄弱</button>
  </div>
  <div id="container"></div>

  <script>
    const API_URL = "/.netlify/functions/getSentences";
    let wordList = [];
    let sentenceList = [];
    let currentTab = "word";
    let filterMode = "review";

    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function loadData(){
      const res = await fetch(API_URL);
      const json = await res.json();
      console.log("完整返回json：",json);

      // ========== 修复点：读取 .content 字段 ==========
      const wordMdText = json.wordLib.result.structuredContent.content;
      const sentenceMdText = json.sentenceLib.result.structuredContent.content;

      console.log("原始单词md全文 >>>", wordMdText);
      console.log("原始句子md全文 >>>", sentenceMdText);

      wordList = parseMarkdownTable(wordMdText);
      sentenceList = parseMarkdownTable(sentenceMdText);

      console.log("解析后的单词列表",wordList);
      console.log("解析后的句子列表",sentenceList);
      render();
    }

    // 适配腾讯文档导出markdown表格解析器
    function parseMarkdownTable(md){
      if (md === null || md === undefined || typeof md !== "string") {
        return [];
      }
      const lines = md.trim().split("\n").filter(line=>line.trim()!=='');
      let sepIndex = -1;
      for(let i=0; i<lines.length; i++){
        if(lines[i].includes("---")){
          sepIndex = i;
          break;
        }
      }
      if(sepIndex < 1) return [];
      const headerLine = lines[sepIndex -1];
      const headersRaw = headerLine.split("|").map(c=>c.trim()).filter(c=>c!=='');

      const rows = [];
      for(let i = sepIndex +1; i<lines.length; i++){
        const line = lines[i].trim();
        if(!line) continue;
        const cells = line.split("|").map(c=>c.trim()).filter(c=>c!=='');
        if(cells.length === 0) continue;
        const obj = {};
        for(let j=0; j<headersRaw.length; j++){
          obj[headersRaw[j]] = cells[j] || "";
        }
        rows.push(obj);
      }
      return rows;
    }

    function switchTab(tab){
      currentTab = tab;
      render();
    }

    function setFilter(mode){
      filterMode = mode;
      render();
    }

    function render(){
      const cont = document.getElementById("container");
      cont.innerHTML = "";
      let sourceList = currentTab === "word" ? wordList : sentenceList;
      let list = [...sourceList];

      // 筛选逻辑
      if(filterMode === "review"){
        if(currentTab === "word"){
          list = list.filter(x=>x["单词熟练度标签"] === "薄弱" || x["单词熟练度标签"] === "待巩固");
        }else{
          list = list.filter(x=>x["句子熟练度标签"] === "薄弱" || x["句子熟练度标签"] === "待巩固");
        }
      }else if(filterMode === "weak"){
        if(currentTab === "word"){
          list = list.filter(x=>x["单词熟练度标签"] === "薄弱");
        }else{
          list = list.filter(x=>x["句子熟练度标签"] === "薄弱");
        }
      }

      console.log("筛选后剩余条数：", list.length, list);
      // 渲染卡片
      for(let item of list){
        const div = document.createElement("div");
        div.className = "card";
        if(currentTab === "word"){
          div.innerHTML = `
            <h2>${item["单词"] || ""}</h2>
            <div class="phonetic">音标：${item["音标"]||"—"}</div>
            <div>词性：${item["词性"]||"—"}</div>
            <span class="tag tag-${item["单词熟练度标签"]}">${item["单词熟练度标签"]||"未标记"}</span>
            <br>
            <button class="btn" onclick="readText('${(item["单词"]||"").replace(/'/g,"\\'")}')">🔊 朗读</button>
            <button class="btn btn-record" onclick="toggleRecord(this)">🎙️ 开始录音</button>
            <audio controls style="margin-top:8px;display:block;">
          `
        }else{
          div.innerHTML = `
            <h2>${item["句子原句"] || ""}</h2>
            <div>分类：${item["句子分类"]||"—"}</div>
            <div>可替换词：${item["可替换词"]||"—"}</div>
            <span class="tag tag-${item["句子熟练度标签"]}">${item["句子熟练度标签"]||"未标记"}</span>
            <br>
            <button class="btn" onclick="readText('${(item["句子原句"]||"").replace(/'/g,"\\'")}')">🔊 朗读句子</button>
            <button class="btn btn-record" onclick="toggleRecord(this)">🎙️ 开始录音</button>
            <audio controls style="margin-top:8px;display:block;">
          `
        }
        cont.appendChild(div);
      }

      // Tab高亮
      document.querySelectorAll(".tab button").forEach(btn=>{
        btn.classList.remove("active");
      })
      document.querySelector(`.tab button[onclick*="${currentTab}"]`)?.classList.add("active");

      // 筛选按钮高亮
      document.querySelectorAll(".filter-line button").forEach(btn=>{
        btn.classList.remove("active");
      })
      document.querySelector(`.filter-line button[onclick*="${filterMode}"]`)?.classList.add("active");
    }

    // 文本朗读
    function readText(text){
      if(!text) return;
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      speechSynthesis.speak(utter);
    }

    // 录音启停
    async function toggleRecord(btn){
      const audioElement = btn.nextElementSibling.nextElementSibling;
      if(!isRecording){
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = ()=>{
          const audioBlob = new Blob(audioChunks, {type:'audio/webm'});
          const audioUrl = URL.createObjectURL(audioBlob);
          audioElement.src = audioUrl;
        }
        mediaRecorder.start();
        isRecording = true;
        btn.innerText = "⏹️ 停止录音";
      }else{
        mediaRecorder.stop();
        isRecording = false;
        btn.innerText = "🎙️ 开始录音";
      }
    }

    // 页面加载自动拉取数据
    loadData();
  </script>
</body>
</html>
